<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>button backdrop</title>
    <style>
      /* The colour comes from the window layer (background_color at
         creation); the page itself stays transparent so it shows
         through. Nothing interactive lives here (spec 7.9). */
      html,
      body {
        background: transparent;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body></body>
</html>
