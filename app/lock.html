<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>button</title>
    <!-- Empty data icon: stops the webview's automatic /favicon.ico
         request, which the asset resolver logs as an error. -->
    <link rel="icon" href="data:," />
    <script type="module" src="/src/overlays/lock.ts" defer></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #1f1f1f;
        color: #f2f2f2;
      }
      .lock-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 8px;
      }
      .lock-panel p {
        margin: 0;
        font-size: 14px;
        text-align: center;
      }
      button {
        padding: 8px 20px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #4f6ef7;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="lock-panel">
      <p>Keyboard locked.<br />Press Esc or click Unlock.</p>
      <button id="unlock">Unlock</button>
    </main>
  </body>
</html>
