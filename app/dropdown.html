<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>button</title>
    <!-- Empty data icon: stops the webview's automatic /favicon.ico
         request, which the asset resolver logs as an error. -->
    <link rel="icon" href="data:," />
    <script type="module" src="/src/dropdown/main.ts" defer></script>
  </head>
  <body>
    <main class="panel">
      <div id="hotkey-warning" class="warning" hidden></div>
      <div id="switch-error" class="warning" role="alert" hidden></div>
      <p id="countdown-line" class="summary" hidden>
        <span id="countdown-text"></span>
        <button id="countdown-cancel" class="link">Cancel</button>
      </p>
      <p id="limit-line" class="summary" hidden>
        <span id="limit-text"></span>
        <button id="extend" class="link">+15 min</button>
      </p>
      <section id="card" class="card">
        <div class="card-text">
          <h1>Recording Mode</h1>
          <p id="action-count"></p>
        </div>
        <button id="start-restore" class="primary"></button>
      </section>
      <p id="switch-summary" class="summary" hidden></p>
      <section id="shelf" class="shelf"></section>
      <button id="show-all" class="link" hidden>Show all</button>
      <section id="more" class="shelf" hidden></section>
      <button id="open-settings" class="link">Settings…</button>
    </main>
  </body>
</html>
