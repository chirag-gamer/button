[package]
name = "button"
version = "0.1.0"
description = "A free, open-source Windows tray app that gets your screen recording-ready in one click and safely puts everything back"
authors = ["chirag-gamer"]
edition = "2024"

# The `_lib` suffix makes the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
[lib]
name = "button_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2.10.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
# Re-exported types of tauri-plugin-global-shortcut 2.4.1; used directly for
# save-time hotkey validation (mods/Code access, clash ids).
global-hotkey = "0.8"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "serde-well-known", "formatting", "parsing", "local-offset"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# Direct dep (D-077): the #[windows_core::interface] macro in dnd.rs emits
# ::windows_core paths, so the crate must be nameable here. Already in the
# lockfile as a transitive dep of `windows`.
windows-core = "=0.62.2"
windows-registry = "=0.6.1"
# Night Light CloudStore blob codec (D-077). Adds windows-registry/result
# 0.100 as duplicate crates.
win-nightlight-lib = "=0.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
