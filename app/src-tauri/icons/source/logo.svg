<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- button's mark: a push button on a blue plate. From app/:
       npx tauri icon src-tauri/icons/source/logo.svg
         makes the app icons (keep only the files icons/ already has);
       npx tauri icon src-tauri/icons/source/logo.svg -p 16,20,24,32,40,48,64 -o DIR
         makes the tray sizes: rename DIR/NxN.png to icons/tray/idle-N.png. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8cff"/>
      <stop offset="1" stop-color="#6c3ff0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e4e6f5"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#14075a" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#plate)"/>
  <rect x="17.5" y="17.5" width="221" height="221" rx="54.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="128" cy="128" r="80" fill="#14075a" fill-opacity="0.22"/>
  <circle cx="128" cy="124" r="62" fill="url(#cap)" filter="url(#shadow)"/>
</svg>
